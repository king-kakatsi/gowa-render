# Keep-alive GOWA hébergé sur Render Free (sleep après ~15 min sans trafic).
# Ping GET /health (public, 2 octets) toutes les 10 min + jitter aléatoire 0-180 s
# => intervalle effectif 10-13 min, aspect "naturel" anti-détection de pattern.
# Ne protège PAS contre la perte de session au restart Render (filesystem
# éphémère en Free) : après un restart, rescan QR manuel, voir tuto.
# Requiert le secret Actions GOWA_URL = https://<service>.onrender.com (sans / final).
name: keepalive-gowa

on:
  schedule:
    - cron: "*/10 * * * *" # toutes les 10 min, heure UTC
  workflow_dispatch: {} # bouton "Run workflow" pour test manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Random jitter 0-180s
        run: sleep $((RANDOM % 181))

      - name: Ping GOWA /health
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ secrets.GOWA_URL }}/health")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || exit 1
