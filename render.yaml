# Blueprint Render — GOWA (test, plan Free)
# Docs limites Free : sleep après ~15 min sans trafic + filesystem éphémère
# (session WhatsApp perdue à chaque restart/redeploy => rescan QR).
# Le keep-alive GitHub Actions (.github/workflows/keepalive.yml) empêche le sleep,
# mais ne peut rien contre la perte de session au restart. Pour la persistance :
# passer en Starter + disque monté sur /app/storages.
services:
  - type: web
    name: gowa
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Port : le CLI Render ne sait pas renseigner "Docker Command", donc on ne
    # peut pas passer --port=$PORT. Solution validée le 12/10/2026 : forcer
    # APP_PORT=10000 (PORT par défaut de Render) via variable d'env
    # (API : PUT /services/{id}/env-vars/APP_PORT). Laisser CMD par défaut.
    healthCheckPath: /health
    envVars:
      - key: APP_PORT
        value: "10000" # = PORT par défaut Render ; si tu changes PORT, change ici aussi
      - key: APP_BASIC_AUTH
        sync: false # secret -> saisi au launch, ex: admin:TonMotDePasseFort
      - key: APP_OS
        value: GOWA-render
      - key: APP_DEBUG
        value: "false"
      - key: WHATSAPP_WEBHOOK
        value: ""
      - key: WHATSAPP_AUTO_MARK_READ
        value: "false"
      - key: WHATSAPP_PRESENCE_ON_CONNECT
        value: unavailable
